<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=0" />
  <meta name="theme-color" content="#0f172a">
  <title>MyShift • Import Auto</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
  <div class="toast" id="toast"></div>

  <header class="appbar">
    <div class="wrap">
      <div class="topline">
        <div class="brand"><div class="t">MyShift AI</div><div class="s" id="topSub">Prêt</div></div>
        <div class="header-actions" style="display:flex; gap:10px;">
          <!-- Bouton Import Direct -->
          <button class="icon-btn" id="btnImport" title="Importer le planning" style="border-color:var(--accent); color:var(--accent); background: rgba(56, 189, 248, 0.1);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          </button>
          <button class="icon-btn" id="btnSettings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
        </div>
      </div>

      <!-- Paramètres Simplifiés (Juste Thème et Paie) -->
      <div class="settings-pop" id="settingsPop">
        <div class="pop-header">Paramètres</div>
        <div class="setting-group">
          <label>Apparence</label>
          <div class="seg-control">
            <button id="themeLight" class="seg-btn">Clair</button>
            <button id="themeDark" class="seg-btn active">Sombre</button>
          </div>
        </div>
        <div class="divider"></div>
        <div class="setting-group">
          <label style="color:var(--accent);">💰 Taux Horaires</label>
          <div class="input-row"><span>Jour</span><input type="number" id="rateDay" value="35" step="0.1"></div>
          <div class="input-row"><span>Nuit</span><input type="number" id="rateNightFull" value="82" step="0.1"></div>
        </div>
        <div class="divider"></div>
        <div class="setting-group">
          <label style="color:var(--accent);">👤 Compte</label>
          <button id="btnLogout" class="btn-full ghost" style="font-size:12px; padding:8px;">Se déconnecter</button>
        </div>
      </div>

      <div class="month-nav">
        <button class="nav-btn" id="btnPrevMonth">‹</button>
        <div class="month-display"><span id="navMonth" class="m-text">Janvier</span><span id="navYear" class="y-text">2026</span></div>
        <button class="nav-btn" id="btnNextMonth">›</button>
      </div>

      <div class="quick-actions">
        <button id="btnToday" class="action-pill primary">Aujourd'hui</button>
        <button id="btnExportXLSX" class="action-pill">📥 Export</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="calendar-card">
        <div class="calendar-head">
          <div class="sem-label">Sem</div>
          <div id="h0">D/L</div><div id="h1">L/M</div><div id="h2">M/M</div>
          <div id="h3">M/J</div><div id="h4">J/V</div><div id="h5">V/S</div><div id="h6">S/D</div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="stats-bar">
          <div class="stat-item"><span class="stat-val" id="statCount">0</span><span class="stat-label">Jours</span></div>
          <div class="stat-divider"></div>
          <div class="stat-item highlight"><span class="stat-val" id="salaryValue">0 €</span><span class="stat-label">Est. Brut</span></div>
        </div>
      </div>
    </div>
  </main>

  <div class="dock-container">
    <div class="dock-glass">
      <div class="sel-info"><div class="sel-date" id="selDate">Sélectionnez une date</div><div class="sel-badge" id="selState">Libre</div></div>
      <div class="actions-grid">
        <button data-set="jour" class="act-btn jour">Jour</button>
        <button data-set="nuit" class="act-btn nuit">Nuit</button>
        <button data-set="repos" class="act-btn repos">Repos</button>
        <button data-set="conges" class="act-btn conges">Congés</button>
        <button data-set="autre" class="act-btn autre">Autre</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".xlsx, .xls" style="display:none">

  <!-- Modale Résultat -->
  <div class="backdrop" id="backdropImport"></div>
  <div class="sheet" id="sheetImport">
    <div class="grabber"></div>
    <div class="sheet-content">
      <h2>🤖 Analyse Terminée</h2>
      <p class="sub-text" id="importSummary">Je cherche la meilleure ligne...</p>
      <div id="importPreviewList" style="max-height:200px; overflow-y:auto; margin-bottom:20px; background:var(--surface); border-radius:12px; padding:10px; border:1px solid var(--border);"></div>
      <button id="btnConfirmImport" class="btn-full primary large">✅ Valider et Importer</button>
      <button id="btnCancelImport" class="btn-full ghost" style="margin-top:8px">Annuler</button>
    </div>
  </div>

  <!-- Modale Note -->
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div class="sheet-content">
      <h2 id="sheetTitle">Détails</h2>
      <textarea id="noteText" placeholder="Note..." style="width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; color:var(--text); margin-bottom:15px;"></textarea>
      <button id="btnSaveNote" class="btn-full primary">Enregistrer</button>
      <button id="btnClearNote" class="btn-full ghost" style="margin-top:8px">Effacer</button>
    </div>
  </div>

  <!-- Modale Export -->
  <div class="backdrop" id="backdropExport"></div>
  <div class="sheet" id="sheetExport">
    <div class="grabber"></div>
    <div class="sheet-content">
      <h2>Exporter</h2>
      <div class="date-range" style="display:flex; gap:10px; margin:15px 0;">
        <div style="flex:1"><label>Du</label><input type="date" id="exportStart" style="width:100%; background:var(--surface); border:1px solid var(--border); padding:8px; color:var(--text); border-radius:8px;"></div>
        <div style="flex:1"><label>Au</label><input type="date" id="exportEnd" style="width:100%; background:var(--surface); border:1px solid var(--border); padding:8px; color:var(--text); border-radius:8px;"></div>
      </div>
      <button id="btnGenerateXLSX" class="btn-full primary large">Télécharger</button>
      <button id="btnCloseExport" class="btn-full ghost" style="margin-top:8px">Annuler</button>
    </div>
  </div>

  <!-- Login -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-logo">MyShift AI</div>
      <h2>Connexion</h2>
      <div class="input-group" style="text-align:left; margin-bottom:15px;"><label>Email</label><input type="email" id="loginEmail" placeholder="vous@exemple.com" style="width:100%; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text);"></div>
      <div class="input-group" style="text-align:left; margin-bottom:20px;"><label>Mot de passe</label><input type="password" id="loginPass" placeholder="••••••" style="width:100%; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text);"></div>
      <button id="btnLogin" class="btn-full primary large">Entrer</button>
      <div id="loginHint" style="color:#f43f5e; font-size:12px; margin-top:10px;"></div>
      <button id="tabSignup" style="background:none; border:none; color:var(--text-muted); margin-top:15px; text-decoration:underline; cursor:pointer;">Créer un compte</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
