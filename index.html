<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planning SNCF</title>

  <style>
    /* =========================================================
      Planning SNCF — UI moderne + grille fixe (sans scroll)
      + Réglages thème Jour/Nuit (forcé)
      + Nav compacte (mois + flèches)
      ========================================================= */

    :root{
      --bg:#f3f5f8;
      --text:rgba(17,24,39,.92);
      --muted:rgba(17,24,39,.58);
      --stroke:rgba(17,24,39,.12);

      --surface:rgba(255,255,255,.78);
      --surface-strong:rgba(255,255,255,.92);

      --primary:#0a84ff;
      --accent:#22c55e;
      --danger:#ff3b30;

      --shadow:0 14px 46px rgba(0,0,0,.12);
      --shadow2:0 6px 18px rgba(0,0,0,.10);

      --r-lg:22px;

      --safeTop: env(safe-area-inset-top);
      --safeBottom: env(safe-area-inset-bottom);

      --jour:#f59e0b;
      --nuit:#6366f1;
      --conges:#ef4444;
      --repos:#9ca3af;
      --autre:#10b981;
    }

    :root[data-theme="dark"]{
      --bg:#0b0c10;
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --stroke:rgba(255,255,255,.12);

      --surface:rgba(255,255,255,.06);
      --surface-strong:rgba(255,255,255,.09);

      --primary:#7c5cff;
      --accent:#4dd7ff;

      --shadow:0 18px 70px rgba(0,0,0,.48);
      --shadow2:0 10px 26px rgba(0,0,0,.35);

      --jour:#fbbf24;
      --nuit:#8b5cf6;
      --conges:#ff4d6d;
      --repos:#a1a1aa;
      --autre:#34d399;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:system-ui,-apple-system,"SF Pro Text","SF Pro Display",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 650px at 10% -10%, color-mix(in srgb, var(--primary) 22%, transparent), transparent 60%),
        radial-gradient(900px 520px at 95% 10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
        var(--bg);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow-x:hidden;
    }

    .wrap{max-width:1100px;margin:0 auto;padding:0 14px}

    button,input,select,textarea{font:inherit;color:inherit}

    button{
      background:var(--surface-strong);
      border:1px solid var(--stroke);
      color:var(--text);
      border-radius:999px;
      padding:12px 14px;
      font-weight:750;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
      transition:transform .06s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    }
    button:hover{box-shadow:var(--shadow2)}
    button:active{transform:scale(.98); box-shadow:none}

    button.primary{
      background:linear-gradient(135deg,
        color-mix(in srgb, var(--primary) 92%, white),
        color-mix(in srgb, var(--primary) 72%, black)
      );
      border-color:color-mix(in srgb, var(--primary) 40%, transparent);
      color:rgba(255,255,255,.96);
    }

    button.danger{
      color:var(--danger);
      border-color:color-mix(in srgb, var(--danger) 35%, transparent);
      background:color-mix(in srgb, var(--surface-strong) 86%, rgba(255,59,48,.10));
    }

    button.icon{
      width:44px;height:44px;padding:0;border-radius:14px;
      display:inline-flex;align-items:center;justify-content:center
    }

    button.pill{border-radius:999px}

    .smallbtn{
      padding:9px 10px;
      font-size:12px;
      font-weight:850;
      line-height:1;
      white-space:nowrap;
    }

    input,select,textarea{
      width:100%;
      background:var(--surface-strong);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:12px 12px;
      outline:none;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }
    textarea{min-height:96px;resize:vertical}

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
      outline:3px solid color-mix(in srgb, var(--primary) 30%, transparent);
      outline-offset:2px;
    }

    .appbar{
      position:sticky; top:0; z-index:50;
      padding-top:calc(10px + var(--safeTop));
      padding-bottom:12px;
      background:color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid var(--stroke);
    }

    .bar{display:flex;flex-direction:column;gap:10px}

    .topline{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .brand{display:flex;flex-direction:column;gap:3px;min-width:0}
    .brand .t{font-size:16px;font-weight:900;letter-spacing:.2px}
    .brand .s{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .settings{position:relative;display:flex;align-items:center;gap:10px}
    .settings-pop{
      position:absolute;
      top:52px;
      right:0;
      width:min(320px, calc(100vw - 28px));
      background:color-mix(in srgb, var(--surface-strong) 92%, transparent);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:12px;
      box-shadow:var(--shadow);
      display:none;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .settings-pop.show{display:block}
    .settings-title{font-weight:900;margin-bottom:10px}
    .setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .setting-label{font-weight:750;color:var(--muted);font-size:12px}
    .settings-hint{margin-top:10px;font-size:12px;color:var(--muted);font-weight:650;line-height:1.3}

    .seg{
      display:flex;
      background:color-mix(in srgb, var(--surface) 70%, transparent);
      border:1px solid var(--stroke);
      border-radius:999px;
      padding:3px;
      gap:3px;
    }
    .segbtn{
      padding:8px 10px;
      font-size:12px;
      font-weight:850;
      border-radius:999px;
      border:0;
      background:transparent;
      box-shadow:none;
    }
    .segbtn.active{
      background:var(--surface-strong);
      border:1px solid var(--stroke);
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }

    /* Nav compacte (mois + flèches) */
    .navpanel{
      width:100%;
      display:grid;
      grid-template-columns: 44px 44px 1fr 44px 44px;
      gap:8px;
      align-items:center;
    }
    .navicon{
      width:44px;
      height:44px;
      padding:0;
      border-radius:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:950;
    }
    .navpill{
      width:100%;
      height:44px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:var(--surface-strong);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:0 12px;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }
    .navpill-month{font-weight:950;font-size:14px;letter-spacing:.2px}
    .navpill-year{font-weight:850;font-size:12px;color:var(--muted)}

    @media (max-width: 360px){
      .wrap{padding:0 10px}
      .navpanel{grid-template-columns: 42px 42px 1fr 42px 42px; gap:6px}
      .navicon{width:42px;height:42px;border-radius:13px}
      .navpill{height:42px;border-radius:13px}
      .navpill-month{font-size:13px}
      .navpill-year{font-size:11px}
      .smallbtn{padding:8px 8px;font-size:11px}
      button.icon{width:42px;height:42px}
    }

    .controls{
      display:grid;
      grid-template-columns: 1fr auto;
      gap:10px;
      align-items:center;
    }

    .controls2{
      display:flex;
      gap:8px;
      flex-wrap:nowrap;
    }
    .controls2 button{
      flex:1;
      min-width:0;
      text-overflow:ellipsis;
      overflow:hidden;
    }

    @media(min-width:900px){
      .controls{grid-template-columns:1fr 360px}
    }

    main{padding:14px 0 calc(150px + var(--safeBottom))}

    .card{
      background:var(--surface);
      border:1px solid var(--stroke);
      border-radius:var(--r-lg);
      padding:14px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .calendar-head{
      display:grid;
      grid-template-columns:44px repeat(7, minmax(0, 1fr));
      gap:10px;
      margin-bottom:10px;
      align-items:center;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .calendar-head div{text-align:center}

    .grid{
      display:grid;
      grid-template-columns:44px repeat(7, minmax(0, 1fr));
      gap:10px;
    }

    @media (max-width: 420px){
      .calendar-head{gap:8px;font-size:10px}
      .grid{gap:8px}
    }

    .weeknum{
      text-align:center;
      font-size:11px;
      font-weight:900;
      color:var(--muted);
      padding-top:16px;
    }

    .day{
      height:58px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:var(--surface-strong);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      font-weight:950;
      font-size:18px;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
      transition:transform .06s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .day:hover{box-shadow:var(--shadow2)}
    .day:active{transform:scale(.985); box-shadow:none}
    .day.out{opacity:.38}
    .day.selected{
      outline:3px solid color-mix(in srgb, var(--primary) 30%, transparent);
      outline-offset:2px;
    }

    @media (max-width: 360px){
      .day{height:54px;font-size:17px;border-radius:16px}
    }

    .dot{
      position:absolute;
      bottom:8px; left:10px;
      width:7px; height:7px;
      border-radius:999px;
      background:color-mix(in srgb, var(--primary) 55%, rgba(255,255,255,.85));
    }
    .badge{
      position:absolute;
      bottom:7px; right:8px;
      font-size:9px;
      font-weight:900;
      padding:2px 6px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:color-mix(in srgb, var(--surface-strong) 88%, transparent);
      color:var(--muted);
    }

    .day.jour{
      background:color-mix(in srgb, var(--jour) 20%, var(--surface-strong));
      border-color:color-mix(in srgb, var(--jour) 28%, var(--stroke));
    }
    .day.nuit{
      background:color-mix(in srgb, var(--nuit) 18%, var(--surface-strong));
      border-color:color-mix(in srgb, var(--nuit) 26%, var(--stroke));
    }
    .day.conges{
      background:color-mix(in srgb, var(--conges) 14%, var(--surface-strong));
      border-color:color-mix(in srgb, var(--conges) 22%, var(--stroke));
    }
    .day.repos{
      background:color-mix(in srgb, var(--repos) 18%, var(--surface-strong));
      border-color:color-mix(in srgb, var(--repos) 22%, var(--stroke));
    }
    .day.autre{
      background:color-mix(in srgb, var(--autre) 16%, var(--surface-strong));
      border-color:color-mix(in srgb, var(--autre) 22%, var(--stroke));
    }

    .totals{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
    }
    .pillchip{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:var(--surface-strong);
      font-weight:850;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }

    .dock{
      position:fixed; left:0; right:0; bottom:0; z-index:60;
      background:color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-top:1px solid var(--stroke);
      padding:10px 12px calc(10px + var(--safeBottom));
    }

    .selbar{
      background:var(--surface-strong);
      border:1px solid var(--stroke);
      border-radius:var(--r-lg);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }
    .selbar .left{min-width:0}
    .selbar .date{font-weight:950;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .selbar .state{font-weight:650;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .actions{
      margin-top:10px;
      display:grid;
      grid-template-columns:repeat(5, minmax(0,1fr));
      gap:10px;
    }
    .actions button{
      padding:14px 6px;
      border-radius:18px;
      font-size:13px;
      font-weight:900;
    }

    @media (max-width: 380px){
      .actions{grid-template-columns:repeat(3, minmax(0,1fr))}
    }

    @media(min-width:900px){
      main{padding-bottom:26px}
      .dock{position:sticky; bottom:0}
      .totals{justify-content:space-between}
    }

    .backdrop{
      position:fixed; inset:0; z-index:80;
      background:rgba(0,0,0,.35);
      backdrop-filter:blur(8px);
      display:none;
    }
    .backdrop.show{display:block}

    .sheet{
      position:fixed; left:0; right:0; bottom:0; z-index:90;
      background:color-mix(in srgb, var(--surface-strong) 94%, transparent);
      border-top:1px solid var(--stroke);
      border-radius:22px 22px 0 0;
      padding:12px 12px calc(14px + var(--safeBottom));
      transform:translateY(110%);
      transition:transform .18s ease;
      box-shadow:var(--shadow);
    }
    .sheet.show{transform:translateY(0)}
    .grab{
      width:44px;height:5px;border-radius:999px;
      background:color-mix(in srgb, var(--muted) 35%, transparent);
      margin:6px auto 12px;
    }
    .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .sheet-title{font-weight:950}
    .sheet-sub{font-weight:650;font-size:12px;color:var(--muted);margin-top:2px}
    .row{display:flex;gap:10px;margin-top:12px}
    .row>*{flex:1}
    .sheet-actions{display:flex;gap:10px;margin-top:12px}
    .sheet-actions button{flex:1}

    .gate{
      position:fixed; inset:0; z-index:100;
      padding:calc(14px + var(--safeTop)) 12px calc(14px + var(--safeBottom));
      background:rgba(0,0,0,.30);
      backdrop-filter:blur(14px);
      display:none;
    }
    .gate.show{display:block}
    .gate-card{
      max-width:420px;
      margin:0 auto;
      background:var(--surface);
      border:1px solid var(--stroke);
      border-radius:var(--r-lg);
      padding:14px;
      box-shadow:var(--shadow);
    }
    .gate-title{font-weight:950;font-size:16px}
    .tabs{display:flex;gap:10px;margin-top:12px}
    .tabs button{flex:1}
    .small{color:var(--muted);font-size:12px;font-weight:650;margin-top:8px;line-height:1.3}

    .toast{
      position:fixed; left:12px; right:12px;
      bottom:calc(160px + var(--safeBottom));
      z-index:120;
      display:none;
      max-width:520px;
      margin:0 auto;
      border-radius:16px;
      border:1px solid var(--stroke);
      background:var(--surface-strong);
      padding:12px 14px;
      font-weight:900;
      box-shadow:var(--shadow2);
    }
    .toast.show{display:block}
  </style>
</head>

<body>
  <div class="toast" id="toast"></div>

  <header class="appbar">
    <div class="wrap">
      <div class="bar">

        <div class="topline">
          <div class="brand">
            <div class="t">Planning SNCF</div>
            <div class="s" id="topSub">Non connecté</div>
          </div>

          <div class="settings">
            <button class="icon" id="btnSettings" aria-label="Réglages">⚙️</button>

            <div class="settings-pop" id="settingsPop" role="dialog" aria-label="Réglages">
              <div class="settings-title">Réglages</div>

              <div class="setting-row">
                <div class="setting-label">Thème</div>
                <div class="seg" role="group" aria-label="Mode jour/nuit">
                  <button id="themeLight" class="segbtn" type="button">Jour</button>
                  <button id="themeDark" class="segbtn" type="button">Nuit</button>
                </div>
              </div>

              <div class="settings-hint">Le choix est mémorisé sur cet appareil.</div>
            </div>
          </div>
        </div>

        <div class="navpanel" aria-label="Navigation calendrier">
          <button class="navicon" id="btnPrevYear" aria-label="Année précédente">«</button>
          <button class="navicon" id="btnPrevMonth" aria-label="Mois précédent">‹</button>

          <button class="navpill" type="button" aria-label="Mois en cours">
            <span class="navpill-month" id="navMonth">—</span>
            <span class="navpill-year" id="navYear">—</span>
          </button>

          <button class="navicon" id="btnNextMonth" aria-label="Mois suivant">›</button>
          <button class="navicon" id="btnNextYear" aria-label="Année suivante">»</button>
        </div>

        <div class="controls">
          <div></div>
          <button id="btnToday" class="primary pill smallbtn">Aujourd’hui SNCF</button>
        </div>

        <div class="controls2">
          <button id="btnExportXLSX" class="pill smallbtn">Export Excel</button>
          <button id="btnLogout" class="pill danger smallbtn">Déconnexion</button>
        </div>

      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="card">
        <div class="calendar-head">
          <div>Sem</div>
          <div>Di/Lu</div><div>Lu/Ma</div><div>Ma/Me</div>
          <div>Me/Je</div><div>Je/Ve</div><div>Ve/Sa</div><div>Sa/Dim</div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="totals" id="totals"></div>
      </section>
    </div>
  </main>

  <div class="dock">
    <div class="wrap">
      <div class="selbar">
        <div class="left">
          <div class="date" id="selDate">Sélectionne une date</div>
          <div class="state" id="selState">État: —</div>
        </div>
        <button id="btnNote" class="pill">📝 Note</button>
      </div>

      <div class="actions">
        <button data-set="jour">Jour</button>
        <button data-set="nuit">Nuit</button>
        <button data-set="repos">Repos</button>
        <button data-set="conges">Congés</button>
        <button data-set="autre">Autre</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Édition du jour">
    <div class="grab"></div>

    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheetTitle">—</div>
        <div class="sheet-sub" id="sheetSub">—</div>
      </div>
      <button id="btnCloseSheet" class="pill">Fermer</button>
    </div>

    <div id="sheetOther">
      <div class="row">
        <select id="otherSelect" aria-label="Type Autre">
          <option value="OCP">OCP</option>
          <option value="Férié">Férié</option>
          <option value="custom">Personnalisé</option>
        </select>
        <input id="otherCustom" placeholder="Libellé" style="display:none" />
      </div>
      <div class="sheet-actions">
        <button class="primary" id="btnApplyOther">Appliquer</button>
        <button id="btnCancelOther">Annuler</button>
      </div>
    </div>

    <div id="sheetNote" style="display:none">
      <textarea id="noteText" placeholder="Note (service, RHR, remplacement…)"></textarea>
      <div class="sheet-actions">
        <button class="primary" id="btnSaveNote">Enregistrer</button>
        <button class="danger" id="btnClearNote">Vider</button>
      </div>
    </div>
  </div>

  <div class="gate" id="gate" aria-label="Connexion">
    <div class="gate-card">
      <div class="gate-title">Connexion</div>
      <div class="small">Email + mot de passe (création + reset).</div>

      <div class="tabs">
        <button id="tabLogin" class="primary">Connexion</button>
        <button id="tabSignup">Créer</button>
      </div>

      <div id="paneLogin" style="margin-top:12px">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
        <input id="loginPass" type="password" placeholder="Mot de passe" autocomplete="current-password">
        <div class="row">
          <button class="primary" id="btnLogin">Se connecter</button>
          <button id="btnReset">Reset</button>
        </div>
        <div class="small" id="loginHint"></div>
      </div>

      <div id="paneSignup" style="margin-top:12px; display:none">
        <input id="signEmail" type="email" placeholder="Email" autocomplete="email">
        <input id="signPass" type="password" placeholder="Mot de passe (min 6)" autocomplete="new-password">
        <div class="row">
          <button class="primary" id="btnSignup">Créer</button>
          <button id="btnBackLogin">Retour</button>
        </div>
        <div class="small">Si la confirmation email est activée sur Supabase, tu devras valider l’email.</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    /* ===== Theme (Jour/Nuit) ===== */
    const LS_THEME_KEY = "sncf_theme_mode_v1"; // "light" | "dark"

    function applyTheme(mode){
      const root = document.documentElement;
      if(mode === "dark") root.setAttribute("data-theme","dark");
      else if(mode === "light") root.setAttribute("data-theme","light");
      else root.removeAttribute("data-theme");
    }
    function updateThemeUI(mode){
      const bL = document.getElementById("themeLight");
      const bD = document.getElementById("themeDark");
      if(!bL || !bD) return;
      bL.classList.toggle("active", mode === "light");
      bD.classList.toggle("active", mode === "dark");
    }
    function setTheme(mode){
      try{ localStorage.setItem(LS_THEME_KEY, mode); }catch{}
      applyTheme(mode);
      updateThemeUI(mode);
    }
    function getSavedTheme(){
      try{ return localStorage.getItem(LS_THEME_KEY); }catch{ return null; }
    }

    /* ===== Supabase ===== */
    const SUPABASE_URL  = "https://dstmyvzjirgyuwuojwnk.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzdG15dnpqaXJneXV3dW9qd25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzY4NTUsImV4cCI6MjA4NTM1Mjg1NX0.Cl6WAvK0elHkKXnXRtrFFiBlGABnK5RTFdawq3NGDJk";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
    });

    /* ===== Constants ===== */
    const MIN_YEAR = 2023;
    const MAX_YEAR = 2035;
    const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
    const DOW = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
    const LABEL = { jour:"Jour", nuit:"Nuit", repos:"Repos", conges:"Congés", autre:"Autre" };
    const LS_KEY = "sncf_planning_state_nolock_v1";

    /* ===== DOM ===== */
    const grid = document.getElementById("grid");
    const totalsEl = document.getElementById("totals");
    const navMonth = document.getElementById("navMonth");
    const navYear = document.getElementById("navYear");
    const topSub = document.getElementById("topSub");
    const selDate = document.getElementById("selDate");
    const selState = document.getElementById("selState");
    const toastEl = document.getElementById("toast");

    const backdrop = document.getElementById("backdrop");
    const sheet = document.getElementById("sheet");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetSub = document.getElementById("sheetSub");
    const sheetOther = document.getElementById("sheetOther");
    const sheetNote = document.getElementById("sheetNote");
    const otherSelect = document.getElementById("otherSelect");
    const otherCustom = document.getElementById("otherCustom");
    const noteText = document.getElementById("noteText");

    const gate = document.getElementById("gate");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const paneLogin = document.getElementById("paneLogin");
    const paneSignup = document.getElementById("paneSignup");
    const loginEmail = document.getElementById("loginEmail");
    const loginPass = document.getElementById("loginPass");
    const signEmail = document.getElementById("signEmail");
    const signPass = document.getElementById("signPass");
    const loginHint = document.getElementById("loginHint");

    /* Settings popover DOM */
    const btnSettings = document.getElementById("btnSettings");
    const settingsPop = document.getElementById("settingsPop");
    const themeLightBtn = document.getElementById("themeLight");
    const themeDarkBtn = document.getElementById("themeDark");

    /* ===== State ===== */
    let user = null;
    let viewYear = 2026;
    let viewMonth = 0;
    let selectedKey = null;
    const entries = new Map();

    /* ===== Helpers ===== */
    const pad2 = (n) => String(n).padStart(2,"0");
    const keyFor = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const parseKey = (k) => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
    const clampYear = (y)=> Math.max(MIN_YEAR, Math.min(MAX_YEAR, y));

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(()=>toastEl.classList.remove("show"), 2500);
    }
    function fmtLong(d){
      return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} (${DOW[d.getDay()]})`;
    }
    function isoWeek(date){
      const d = new Date(date);
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7));
      const week1 = new Date(d.getFullYear(),0,4);
      return 1 + Math.round(((d-week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
    }
    function getSncfNow(){
      const d = new Date();
      if (d.getHours() >= 22) d.setDate(d.getDate() + 1);
      return d;
    }

    function saveViewState(){
      try{ localStorage.setItem(LS_KEY, JSON.stringify({viewYear, viewMonth, selectedKey})); }catch{}
    }
    function restoreViewState(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        if(!raw) return false;
        const st = JSON.parse(raw);
        if(!st) return false;
        viewYear = clampYear(st.viewYear ?? viewYear);
        viewMonth = Math.max(0, Math.min(11, st.viewMonth ?? viewMonth));
        selectedKey = (typeof st.selectedKey==="string") ? st.selectedKey : null;
        return true;
      }catch{return false;}
    }

    function gridRangeForMonth(year, month){
      const first = new Date(year, month, 1);
      const start = new Date(year, month, 1 - first.getDay());
      const end = new Date(start);
      end.setDate(start.getDate() + 41);
      return { start, end, fromKey:keyFor(start), toKey:keyFor(end) };
    }

    function openSheet(mode){
      sheetOther.style.display = (mode==="other") ? "block" : "none";
      sheetNote.style.display  = (mode==="note")  ? "block" : "none";
      backdrop.classList.add("show");
      sheet.classList.add("show");
    }
    function closeSheet(){
      backdrop.classList.remove("show");
      sheet.classList.remove("show");
    }
    backdrop.addEventListener("click", closeSheet);
    document.getElementById("btnCloseSheet").addEventListener("click", closeSheet);
    document.getElementById("btnCancelOther").addEventListener("click", closeSheet);
    otherSelect.addEventListener("change", ()=>{
      otherCustom.style.display = (otherSelect.value==="custom") ? "block" : "none";
    });

    function showPane(which){
      if(which==="login"){
        paneLogin.style.display="block"; paneSignup.style.display="none";
        tabLogin.classList.add("primary"); tabSignup.classList.remove("primary");
      }else{
        paneLogin.style.display="none"; paneSignup.style.display="block";
        tabSignup.classList.add("primary"); tabLogin.classList.remove("primary");
      }
    }
    tabLogin.addEventListener("click", ()=>showPane("login"));
    tabSignup.addEventListener("click", ()=>showPane("signup"));
    document.getElementById("btnBackLogin").addEventListener("click", ()=>showPane("login"));

    document.getElementById("btnLogin").addEventListener("click", async ()=>{
      loginHint.textContent="";
      const email = (loginEmail.value||"").trim();
      const pass  = loginPass.value||"";
      if(!email || !pass){ loginHint.textContent="Email + mot de passe requis."; return; }
      const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if(error){ console.error(error); loginHint.textContent = error.message || "Erreur connexion."; }
    });

    document.getElementById("btnSignup").addEventListener("click", async ()=>{
      const email = (signEmail.value||"").trim();
      const pass  = (signPass.value||"");
      if(!email || !pass){ toast("Email + mot de passe requis."); return; }
      if(pass.length < 6){ toast("Mot de passe: 6 caractères minimum."); return; }
      const { error } = await supabase.auth.signUp({ email, password: pass });
      if(error){ console.error(error); toast(error.message || "Erreur création compte."); return; }
      toast("Compte créé. Connecte-toi.");
      showPane("login");
      loginEmail.value=email; loginPass.value="";
    });

    document.getElementById("btnReset").addEventListener("click", async ()=>{
      const email = (loginEmail.value||"").trim();
      if(!email){ loginHint.textContent="Entre ton email puis reset."; return; }
      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if(error){ console.error(error); loginHint.textContent = error.message || "Erreur reset."; return; }
      loginHint.textContent="Email de réinitialisation envoyé.";
    });

    document.getElementById("btnLogout").addEventListener("click", async ()=>{
      await supabase.auth.signOut();
      entries.clear(); user=null;
      topSub.textContent="Non connecté";
      gate.classList.add("show");
      renderMonth(); renderTotals();
    });

    async function refreshSessionUser(){
      const { data, error } = await supabase.auth.getSession();
      if(error){ console.error(error); user=null; }
      user = data?.session?.user || null;

      if(!user){
        topSub.textContent="Non connecté";
        gate.classList.add("show");
      }else{
        const uidShort = String(user.id||"").slice(0,8);
        topSub.textContent = `${user.email || "Connecté"} · uid:${uidShort}`;
        gate.classList.remove("show");
      }
    }

    async function loadGridEntries(){
      entries.clear();
      if(!user) return;

      const { fromKey, toKey } = gridRangeForMonth(viewYear, viewMonth);

      const { data, error } = await supabase
        .from("work_calendar_entries")
        .select("work_date,status,custom_label,note")
        .gte("work_date", fromKey)
        .lte("work_date", toKey);

      if(error){
        console.error(error);
        toast("Erreur Supabase: " + (error.message || error.code || ""));
        return;
      }

      (data||[]).forEach(r=>{
        entries.set(r.work_date, {
          status: r.status,
          custom_label: r.custom_label || "",
          note: r.note || ""
        });
      });

      toast(`Chargé: ${(data||[]).length} jour(s)`);
    }

    async function upsertDay(dateKey, patch){
      if(!user){ toast("Connecte-toi."); return; }

      const cur = entries.get(dateKey) || { status:"", custom_label:"", note:"" };
      const next = { ...cur, ...patch };

      entries.set(dateKey, next);
      renderMonth(); renderTotals(); setSelected(dateKey);

      const { error } = await supabase
        .from("work_calendar_entries")
        .upsert({
          user_id: user.id,
          work_date: dateKey,
          status: next.status,
          custom_label: next.custom_label || null,
          note: next.note || null
        }, { onConflict: "user_id,work_date" });

      if(error){
        console.error(error);
        if(cur.status || cur.note || cur.custom_label) entries.set(dateKey, cur);
        else entries.delete(dateKey);
        renderMonth(); renderTotals(); setSelected(dateKey);
        toast("Erreur sauvegarde: " + (error.message || error.code || ""));
        return;
      }
      saveViewState();
    }

    function renderMonth(){
      grid.innerHTML="";
      navMonth.textContent = MONTHS[viewMonth];
      navYear.textContent  = String(viewYear);

      const { start } = gridRangeForMonth(viewYear, viewMonth);

      for(let week=0; week<6; week++){
        const weekStart = new Date(start);
        weekStart.setDate(start.getDate() + week*7);

        const wn = document.createElement("div");
        wn.className="weeknum";
        wn.textContent = String(isoWeek(weekStart)).padStart(2,"0");
        grid.appendChild(wn);

        for(let i=0;i<7;i++){
          const d = new Date(weekStart);
          d.setDate(weekStart.getDate()+i);
          const k = keyFor(d);

          const cell = document.createElement("div");
          cell.className="day";
          cell.dataset.key=k;

          if(d.getMonth() !== viewMonth) cell.classList.add("out");

          const e = entries.get(k);
          if(e?.status) cell.classList.add(e.status);
          if(k === selectedKey) cell.classList.add("selected");

          cell.textContent = String(d.getDate());

          if(e?.note){
            const dot = document.createElement("div");
            dot.className="dot";
            cell.appendChild(dot);
          }
          if(e?.status==="autre" && e.custom_label){
            const b = document.createElement("div");
            b.className="badge";
            b.textContent = e.custom_label.slice(0,6);
            cell.appendChild(b);
          }

          cell.addEventListener("click", ()=>{
            setSelected(k);
            saveViewState();
          }, {passive:true});

          grid.appendChild(cell);
        }
      }
    }

    function setSelected(k){
      selectedKey = k;
      const d = parseKey(k);
      const e = entries.get(k);
      const state = e?.status ? LABEL[e.status] : "—";
      const extra = (e?.status==="autre" && e.custom_label) ? ` (${e.custom_label})` : "";

      selDate.textContent = fmtLong(d);
      selState.textContent = `État: ${state}${extra}`;
      sheetTitle.textContent = fmtLong(d);
      sheetSub.textContent = `État actuel: ${state}${extra}`;
      noteText.value = e?.note || "";

      grid.querySelectorAll(".day").forEach(el=>el.classList.remove("selected"));
      const el = grid.querySelector(\`.day[data-key="\${k}"]\`);
      if(el) el.classList.add("selected");
    }

    function renderTotals(){
      let cJ=0,cN=0,cR=0,cC=0,cA=0;
      const keys = Array.from(entries.keys()).sort();
      for(const k of keys){
        const e = entries.get(k);
        if(!e?.status) continue;
        if(e.status==="jour") cJ++;
        if(e.status==="nuit") cN++;
        if(e.status==="repos") cR++;
        if(e.status==="conges") cC++;
        if(e.status==="autre") cA++;
      }
      totalsEl.innerHTML="";
      const chip=(t)=>{
        const d=document.createElement("div");
        d.className="pillchip";
        d.textContent=t;
        return d;
      };
      totalsEl.appendChild(chip(\`Jours: \${cJ}\`));
      totalsEl.appendChild(chip(\`Nuits: \${cN}\`));
      totalsEl.appendChild(chip(\`Repos: \${cR}\`));
      totalsEl.appendChild(chip(\`Congés: \${cC}\`));
      totalsEl.appendChild(chip(\`Autres: \${cA}\`));
    }

    function ensureSelected(){
      if(!selectedKey){
        const d = getSncfNow();
        viewYear = clampYear(d.getFullYear());
        viewMonth = d.getMonth();
        selectedKey = keyFor(d);
      }
      return selectedKey;
    }

    document.querySelectorAll("[data-set]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const k = ensureSelected();
        const dSel = parseKey(k);

        if(dSel.getFullYear()!==viewYear || dSel.getMonth()!==viewMonth){
          viewYear = clampYear(dSel.getFullYear());
          viewMonth = dSel.getMonth();
          await reloadView(true);
        }

        const type = btn.dataset.set;

        if(type==="autre"){
          const e = entries.get(k);
          otherSelect.value="OCP"; otherCustom.value=""; otherCustom.style.display="none";
          if(e?.status==="autre" && e.custom_label){
            if(e.custom_label==="OCP" || e.custom_label==="Férié") otherSelect.value=e.custom_label;
            else { otherSelect.value="custom"; otherCustom.style.display="block"; otherCustom.value=e.custom_label; }
          }
          openSheet("other");
          return;
        }

        await upsertDay(k, { status:type, custom_label:"" });
      });
    });

    document.getElementById("btnNote").addEventListener("click", ()=>{
      ensureSelected();
      openSheet("note");
    });

    document.getElementById("btnApplyOther").addEventListener("click", async ()=>{
      const k = ensureSelected();
      let label = otherSelect.value;
      if(label==="custom"){
        label = (otherCustom.value||"").trim();
        if(!label){ toast("Entre un libellé."); return; }
      }
      await upsertDay(k, { status:"autre", custom_label:label });
      closeSheet();
    });

    document.getElementById("btnSaveNote").addEventListener("click", async ()=>{
      const k = ensureSelected();
      await upsertDay(k, { note:(noteText.value||"").trim() });
      closeSheet();
    });

    document.getElementById("btnClearNote").addEventListener("click", async ()=>{
      const k = ensureSelected();
      noteText.value="";
      await upsertDay(k, { note:"" });
      closeSheet();
    });

    async function changeMonth(delta){
      let y=viewYear, m=viewMonth+delta;
      if(m<0){m=11;y--}
      if(m>11){m=0;y++}
      viewYear = clampYear(y);
      viewMonth = m;
      await reloadView(false);
      saveViewState();
    }
    async function changeYear(delta){
      viewYear = clampYear(viewYear + delta);
      await reloadView(false);
      saveViewState();
    }
    document.getElementById("btnPrevMonth").addEventListener("click", ()=>changeMonth(-1));
    document.getElementById("btnNextMonth").addEventListener("click", ()=>changeMonth(1));
    document.getElementById("btnPrevYear").addEventListener("click", ()=>changeYear(-1));
    document.getElementById("btnNextYear").addEventListener("click", ()=>changeYear(1));

    document.getElementById("btnToday").addEventListener("click", async ()=>{
      const d = getSncfNow();
      viewYear = clampYear(d.getFullYear());
      viewMonth = d.getMonth();
      selectedKey = keyFor(d);
      await reloadView(true);
      saveViewState();
    });

    document.getElementById("btnExportXLSX").addEventListener("click", ()=>{
      const rows = [["Date","Année","Mois","Semaine","Type","Libellé","Note"]];
      const keys = Array.from(entries.keys()).sort();
      for(const k of keys){
        const e = entries.get(k);
        if(!e?.status) continue;
        const d = new Date(k);
        rows.push([k, d.getFullYear(), MONTHS[d.getMonth()], String(isoWeek(d)).padStart(2,"0"),
          LABEL[e.status]||"", e.custom_label||"", e.note||"" ]);
      }
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Planning");
      XLSX.writeFile(wb, `planning_${viewYear}-${pad2(viewMonth+1)}.xlsx`);
    });

    async function reloadView(keepSelection){
      await loadGridEntries();
      renderMonth();
      renderTotals();
      if(keepSelection && selectedKey) setSelected(selectedKey);
      else{
        const k = `${viewYear}-${pad2(viewMonth+1)}-01`;
        selectedKey = k;
        setSelected(k);
      }
    }

    function initSettings(){
      const saved = getSavedTheme();
      const mode = (saved === "dark" || saved === "light") ? saved : "light";
      applyTheme(mode);
      updateThemeUI(mode);

      btnSettings.addEventListener("click", (e)=>{
        e.stopPropagation();
        settingsPop.classList.toggle("show");
      });

      document.addEventListener("click", ()=> settingsPop.classList.remove("show"));
      settingsPop.addEventListener("click", (e)=>e.stopPropagation());

      themeLightBtn.addEventListener("click", ()=>setTheme("light"));
      themeDarkBtn.addEventListener("click", ()=>setTheme("dark"));
    }

    async function init(){
      initSettings();

      const restored = restoreViewState();
      if(!restored){
        const now = getSncfNow();
        viewYear = clampYear(now.getFullYear());
        viewMonth = now.getMonth();
        selectedKey = keyFor(now);
      }

      renderMonth();
      renderTotals();
      if(selectedKey) setSelected(selectedKey);

      await refreshSessionUser();
      if(user) await reloadView(true);

      supabase.auth.onAuthStateChange(async ()=>{
        await refreshSessionUser();
        if(user) await reloadView(true);
      });
    }

    init();
  </script>
</body>
</html>
