<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0" />
  
  <!-- Configuration PWA / iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>Mon Planning</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Icône pour l'écran d'accueil (optionnel, créez un fichier icon-192.png si voulu) -->
  <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>

  <!-- Notification Toast -->
  <div class="toast" id="toast"></div>

  <!-- Barre du haut -->
  <header class="appbar">
    <div class="wrap">
      <div class="topline">
        <div class="brand">
          <div class="t">Planning</div>
          <div class="s" id="topSub">Chargement...</div>
        </div>
        <button class="icon" id="btnSettings" aria-label="Réglages">⚙️</button>
      </div>

      <!-- Popover Réglages -->
      <div class="settings-pop" id="settingsPop">
        <div class="settings-title">Réglages</div>
        
        <div class="setting-row">
          <span>Thème</span>
          <div class="seg">
            <button id="themeLight" class="segbtn">Clair</button>
            <button id="themeDark" class="segbtn">Sombre</button>
          </div>
        </div>
        
        <div class="setting-row">
          <span>Clic direct = Jour</span>
          <input type="checkbox" id="togQuickTap">
        </div>
        
        <div class="setting-row">
          <span>Confirmer Déco</span>
          <input type="checkbox" id="togConfirmLogout" checked>
        </div>
        
        <div style="font-size:11px; color:var(--muted); margin-top:10px; text-align:center;">
          Les réglages sont locaux.
        </div>
      </div>

      <!-- Navigation Mois -->
      <div class="monthbar">
        <button class="icon" id="btnPrevMonth" aria-label="Mois précédent">‹</button>
        <div class="month-label">
          <span id="navMonth">...</span> <span id="navYear">...</span>
        </div>
        <button class="icon" id="btnNextMonth" aria-label="Mois suivant">›</button>
      </div>

      <!-- Actions Rapides -->
      <div class="top-actions">
        <button id="btnPrevYear" class="smallbtn">«</button>
        <button id="btnToday" class="primary smallbtn">Aujourd'hui</button>
        <button id="btnNextYear" class="smallbtn">»</button>
        <button id="btnExportXLSX" class="smallbtn">Export</button>
        <button id="btnLogout" class="danger smallbtn">Déco</button>
      </div>
    </div>
  </header>

  <!-- Calendrier -->
  <main>
    <div class="wrap">
      <div class="card">
        <div class="calendar-head">
          <div>Sem</div>
          <div id="h0">Dim</div><div id="h1">Lun</div><div id="h2">Mar</div>
          <div id="h3">Mer</div><div id="h4">Jeu</div><div id="h5">Ven</div><div id="h6">Sam</div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="totals" id="totals"></div>
      </div>
    </div>
  </main>

  <!-- Barre d'actions (Bas) -->
  <div class="dock">
    <div class="wrap">
      <div class="selbar">
        <div>
          <div class="sel-date" id="selDate">Sélectionnez une date</div>
          <div class="sel-state" id="selState">État: —</div>
        </div>
        <button id="btnNote" class="smallbtn">📝 Note</button>
      </div>
      
      <div class="actions">
        <button data-set="jour" type="button">Jour</button>
        <button data-set="nuit" type="button">Nuit</button>
        <button data-set="repos" type="button">Repos</button>
        <button data-set="conges" type="button">Congés</button>
        <button data-set="autre" type="button">Autre</button>
      </div>
    </div>
  </div>

  <!-- Fenêtre Modale (Sheet) -->
  <div class="backdrop" id="backdrop"></div>
  
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheetTitle">Date</div>
        <div class="sheet-sub" id="sheetSub">Détails</div>
      </div>
      <button id="btnCloseSheet" class="smallbtn">Fermer</button>
    </div>
    
    <!-- Contenu Note -->
    <div id="sheetNote">
      <textarea id="noteText" placeholder="Votre note (ex: 14h-22h, RHR...)"></textarea>
      <div class="sheet-actions">
        <button id="btnSaveNote" class="primary">Enregistrer</button>
        <button id="btnClearNote" class="danger">Effacer</button>
      </div>
    </div>

    <!-- Contenu Autre -->
    <div id="sheetOther" style="display:none">
      <select id="otherSelect">
        <option value="OCP">OCP</option>
        <option value="Férié">Férié</option>
        <option value="custom">Personnalisé...</option>
      </select>
      <input id="otherCustom" placeholder="Libellé personnalisé" style="display:none; margin-top:8px">
      <div class="sheet-actions">
        <button id="btnApplyOther" class="primary">Valider</button>
      </div>
    </div>
  </div>

  <!-- Écran de Connexion (GATE) -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <h2>Connexion</h2>
      
      <div class="tabs">
        <button id="tabLogin" class="active">Se connecter</button>
        <button id="tabSignup">Créer un compte</button>
      </div>

      <div id="paneLogin">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPass" placeholder="Mot de passe" style="margin-top:8px" autocomplete="current-password">
        
        <button id="btnLogin" class="primary" style="width:100%; margin-top:16px; padding:14px;">Entrer</button>
        <button id="btnReset" style="width:100%; margin-top:8px; background:transparent; border:none; color:var(--muted); font-size:13px;">Mot de passe oublié ?</button>
        <div id="loginHint" class="small"></div>
      </div>

      <div id="paneSignup" style="display:none">
        <input type="email" id="signEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="signPass" placeholder="Mot de passe (min 6)" style="margin-top:8px" autocomplete="new-password">
        
        <button id="btnSignup" class="primary" style="width:100%; margin-top:16px; padding:14px;">Créer le compte</button>
        <button id="btnBackLogin" style="width:100%; margin-top:8px; background:transparent; border:none; color:var(--muted); font-size:13px;">Retour</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
