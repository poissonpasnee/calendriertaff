<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Planning SNCF – Calendrier mensuel</title>

<style>
:root{
  --bg:#0e1117;
  --panel:#151a23;
  --panel2:#0f1420;
  --border:#242b3a;
  --text:#e6e8ee;
  --muted:#9aa4b2;
  --primary:#1f6feb;

  --jour:#facc15;
  --nuit:#8b5cf6;
  --conges:#7f1d1d;
  --repos:#6b7280;
  --autre:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg);
  color:var(--text);
}

.day.jour{background:rgba(250,204,21,.35)}
.day.nuit{background:rgba(139,92,246,.35)}
.day.conges{background:rgba(127,29,29,.45)}
.day.repos{background:rgba(107,114,128,.35)}
.day.autre{background:rgba(245,158,11,.35)}

.day{
  height:48px;
  border-radius:14px;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  cursor:pointer;
}
.day.out{opacity:.35}
.day.selected{outline:2px solid var(--primary)}

.grid{
  display:grid;
  grid-template-columns:50px repeat(7,1fr);
  gap:6px;
}

.weeknum{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding-top:14px;
}

header{
  padding:10px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
button{
  background:none;
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 12px;
  border-radius:12px;
  font-weight:700;
}
</style>
</head>

<body>

<header>
  <strong id="monthLabel"></strong>
  <div>
    <button id="prev">‹</button>
    <button id="next">›</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<div style="position:fixed;bottom:0;left:0;right:0;padding:10px;background:#0e1117">
  <button data-set="jour">Jour</button>
  <button data-set="nuit">Nuit</button>
  <button data-set="repos">Repos</button>
  <button data-set="conges">Congés</button>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://dstmyvzjirgyuwuojwnk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzdG15dnpqaXJneXV3dW9qd25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzY4NTUsImV4cCI6MjA4NTM1Mjg1NX0.Cl6WAvK0elHkKXnXRtrFFiBlGABnK5RTFdawq3NGDJk"
);

const grid = document.getElementById("grid");
const monthLabel = document.getElementById("monthLabel");

const MONTHS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

let view = new Date();
let user = null;
let selected = null;
const entries = new Map();

function key(d){
  return d.toISOString().slice(0,10);
}

function isoWeek(d){
  d=new Date(d);d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-(d.getDay()+6)%7);
  const w1=new Date(d.getFullYear(),0,4);
  return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);
}

async function loadMonth(){
  entries.clear();

  if(!user) return; // ⛔ CORRECTION CLÉ

  const y=view.getFullYear(), m=view.getMonth();
  const from=`${y}-${String(m+1).padStart(2,"0")}-01`;
  const to=`${y}-${String(m+1).padStart(2,"0")}-31`;

  const {data,error}=await supabase
    .from("work_calendar_entries")
    .select("work_date,status")
    .eq("user_id",user.id)
    .gte("work_date",from)
    .lte("work_date",to);

  if(error){
    console.warn("Supabase load ignoré:", error.message);
    return;
  }

  data.forEach(r=>{
    entries.set(r.work_date,r.status);
  });
}

function render(){
  grid.innerHTML="";
  monthLabel.textContent = MONTHS[view.getMonth()]+" "+view.getFullYear();

  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const start=new Date(first);
  start.setDate(1-first.getDay());

  for(let w=0;w<6;w++){
    const d=new Date(start);d.setDate(start.getDate()+w*7);
    const wn=document.createElement("div");
    wn.className="weeknum";
    wn.textContent=isoWeek(d);
    grid.appendChild(wn);

    for(let i=0;i<7;i++){
      const day=new Date(d);day.setDate(d.getDate()+i);
      const k=key(day);
      const div=document.createElement("div");
      div.className="day";
      if(day.getMonth()!==view.getMonth())div.classList.add("out");
      if(entries.has(k))div.classList.add(entries.get(k));
      if(k===selected)div.classList.add("selected");
      div.textContent=day.getDate();
      div.onclick=()=>{selected=k;render();}
      grid.appendChild(div);
    }
  }
}

async function init(){
  const {data}=await supabase.auth.getUser();
  user=data.user||null;
  await loadMonth();
  render();
}

document.querySelectorAll("[data-set]").forEach(b=>{
  b.onclick=async()=>{
    if(!selected||!user)return;
    const status=b.dataset.set;
    await supabase.from("work_calendar_entries").upsert({
      user_id:user.id,
      work_date:selected,
      status
    });
    entries.set(selected,status);
    render();
  };
});

document.getElementById("prev").onclick=async()=>{
  view.setMonth(view.getMonth()-1);
  await loadMonth();
  render();
};
document.getElementById("next").onclick=async()=>{
  view.setMonth(view.getMonth()+1);
  await loadMonth();
  render();
};

init();
</script>
</body>
</html>
