<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planning SNCF</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="toast" id="toast"></div>

  <header class="appbar">
    <div class="wrap">
      <div class="bar">

        <div class="topline">
          <div class="brand">
            <div class="t">Planning SNCF</div>
            <div class="s" id="topSub">Non connecté</div>
          </div>

          <!-- Réglages (haut droite) -->
          <div class="settings">
            <button class="icon" id="btnSettings" aria-label="Réglages" type="button">⚙️</button>

            <div class="settings-pop" id="settingsPop" role="dialog" aria-label="Réglages">
              <div class="settings-title">Réglages</div>

              <div class="setting-row">
                <div class="setting-label">Thème</div>
                <div class="seg" role="group" aria-label="Mode jour/nuit">
                  <button id="themeLight" class="segbtn" type="button">Jour</button>
                  <button id="themeDark" class="segbtn" type="button">Nuit</button>
                </div>
              </div>

              <div class="settings-hint">Le choix est mémorisé sur cet appareil.</div>
            </div>
          </div>
        </div>

        <!-- Mois + flèches intégrés -->
        <div class="monthnav" aria-label="Navigation calendrier">
          <div class="monthpill">
            <div class="m" id="navMonth">—</div>
            <div class="y" id="navYear">—</div>
          </div>

          <div class="arrows">
            <button class="icon" id="btnPrevYear" aria-label="Année précédente" type="button">«</button>
            <button class="icon" id="btnPrevMonth" aria-label="Mois précédent" type="button">‹</button>
            <button class="icon" id="btnNextMonth" aria-label="Mois suivant" type="button">›</button>
            <button class="icon" id="btnNextYear" aria-label="Année suivante" type="button">»</button>
          </div>
        </div>

        <div class="controls">
          <button id="btnToday" class="primary pill smallbtn" type="button">Aujourd’hui SNCF</button>
        </div>

        <div class="controls2">
          <button id="btnExportXLSX" class="pill smallbtn" type="button">Export Excel</button>
          <button id="btnLogout" class="pill danger smallbtn" type="button">Déconnexion</button>
        </div>

      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="card">
        <div class="calendar-head">
          <div>Sem</div>
          <div>Di/Lu</div><div>Lu/Ma</div><div>Ma/Me</div>
          <div>Me/Je</div><div>Je/Ve</div><div>Ve/Sa</div><div>Sa/Dim</div>
        </div>

        <div class="grid" id="grid"></div>
        <div class="totals" id="totals"></div>
      </section>
    </div>
  </main>

  <div class="dock">
    <div class="wrap">
      <div class="selbar">
        <div class="left">
          <div class="date" id="selDate">Sélectionne une date</div>
          <div class="state" id="selState">État: —</div>
        </div>
        <button id="btnNote" class="pill" type="button">📝 Note</button>
      </div>

      <div class="actions">
        <button data-set="jour" type="button">Jour</button>
        <button data-set="nuit" type="button">Nuit</button>
        <button data-set="repos" type="button">Repos</button>
        <button data-set="conges" type="button">Congés</button>
        <button data-set="autre" type="button">Autre</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Édition du jour">
    <div class="grab"></div>

    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheetTitle">—</div>
        <div class="sheet-sub" id="sheetSub">—</div>
      </div>
      <button id="btnCloseSheet" class="pill" type="button">Fermer</button>
    </div>

    <div id="sheetOther">
      <div class="row">
        <select id="otherSelect" aria-label="Type Autre">
          <option value="OCP">OCP</option>
          <option value="Férié">Férié</option>
          <option value="custom">Personnalisé</option>
        </select>
        <input id="otherCustom" placeholder="Libellé" style="display:none" />
      </div>
      <div class="sheet-actions">
        <button class="primary" id="btnApplyOther" type="button">Appliquer</button>
        <button id="btnCancelOther" type="button">Annuler</button>
      </div>
    </div>

    <div id="sheetNote" style="display:none">
      <textarea id="noteText" placeholder="Note (service, RHR, remplacement…)"></textarea>
      <div class="sheet-actions">
        <button class="primary" id="btnSaveNote" type="button">Enregistrer</button>
        <button class="danger" id="btnClearNote" type="button">Vider</button>
      </div>
    </div>
  </div>

  <div class="gate" id="gate" aria-label="Connexion">
    <div class="gate-card">
      <div class="gate-title">Connexion</div>
      <div class="small">Email + mot de passe (création + reset).</div>

      <div class="tabs">
        <button id="tabLogin" class="primary" type="button">Connexion</button>
        <button id="tabSignup" type="button">Créer</button>
      </div>

      <div id="paneLogin" style="margin-top:12px">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
        <input id="loginPass" type="password" placeholder="Mot de passe" autocomplete="current-password">
        <div class="row">
          <button class="primary" id="btnLogin" type="button">Se connecter</button>
          <button id="btnReset" type="button">Reset</button>
        </div>
        <div class="small" id="loginHint"></div>
      </div>

      <div id="paneSignup" style="margin-top:12px; display:none">
        <input id="signEmail" type="email" placeholder="Email" autocomplete="email">
        <input id="signPass" type="password" placeholder="Mot de passe (min 6)" autocomplete="new-password">
        <div class="row">
          <button class="primary" id="btnSignup" type="button">Créer</button>
          <button id="btnBackLogin" type="button">Retour</button>
        </div>
        <div class="small">Si la confirmation email est activée sur Supabase, tu devras valider l’email.</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
