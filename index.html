<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planning SNCF</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="toast" id="toast"></div>

  <header class="appbar">
    <div class="wrap">
      <div class="bar">
        <div class="topline">
          <div class="brand">
            <div class="t">Planning SNCF</div>
            <div class="s" id="topSub">Non connecté</div>
          </div>
        </div>

        <div class="monthpill">
          <div class="m" id="navMonth">—</div>
          <div class="y" id="navYear">—</div>
        </div>

        <div class="controls">
          <div class="arrows">
            <button class="icon" id="btnPrevYear" aria-label="Année précédente">«</button>
            <button class="icon" id="btnPrevMonth" aria-label="Mois précédent">‹</button>
            <button class="icon" id="btnNextMonth" aria-label="Mois suivant">›</button>
            <button class="icon" id="btnNextYear" aria-label="Année suivante">»</button>
          </div>
          <button id="btnToday" class="primary pill">Aujourd’hui SNCF</button>
        </div>

        <div class="controls2">
          <button id="btnExportXLSX" class="pill">Export Excel</button>
          <button id="btnLogout" class="pill danger">Déconnexion</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="card">
        <!-- WRAPPER IMPORTANT : centre la grille sur mobile -->
        <div class="cal-scroll" aria-label="Calendrier">
          <div class="cal-inner">
            <div class="calendar-head">
              <div>Sem</div>
              <div>Di/Lu</div><div>Lu/Ma</div><div>Ma/Me</div>
              <div>Me/Je</div><div>Je/Ve</div><div>Ve/Sa</div><div>Sa/Dim</div>
            </div>

            <div class="grid" id="grid"></div>
          </div>
        </div>

        <div class="totals" id="totals"></div>
      </section>
    </div>
  </main>

  <div class="dock">
    <div class="wrap">
      <div class="selbar">
        <div class="left">
          <div class="date" id="selDate">Sélectionne une date</div>
          <div class="state" id="selState">État: —</div>
        </div>
        <button id="btnNote" class="pill">📝 Note</button>
      </div>

      <div class="actions">
        <button data-set="jour">Jour</button>
        <button data-set="nuit">Nuit</button>
        <button data-set="repos">Repos</button>
        <button data-set="conges">Congés</button>
        <button data-set="autre">Autre</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Édition du jour">
    <div class="grab"></div>

    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheetTitle">—</div>
        <div class="sheet-sub" id="sheetSub">—</div>
      </div>
      <button id="btnCloseSheet" class="pill">Fermer</button>
    </div>

    <div id="sheetOther">
      <div class="row">
        <select id="otherSelect" aria-label="Type Autre">
          <option value="OCP">OCP</option>
          <option value="Férié">Férié</option>
          <option value="custom">Personnalisé</option>
        </select>
        <input id="otherCustom" placeholder="Libellé" style="display:none" />
      </div>
      <div class="sheet-actions">
        <button class="primary" id="btnApplyOther">Appliquer</button>
        <button id="btnCancelOther">Annuler</button>
      </div>
    </div>

    <div id="sheetNote" style="display:none">
      <textarea id="noteText" placeholder="Note (service, RHR, remplacement…)"></textarea>
      <div class="sheet-actions">
        <button class="primary" id="btnSaveNote">Enregistrer</button>
        <button class="danger" id="btnClearNote">Vider</button>
      </div>
    </div>
  </div>

  <div class="gate" id="gate" aria-label="Connexion">
    <div class="gate-card">
      <div class="gate-title">Connexion</div>
      <div class="small">Email + mot de passe (création + reset).</div>

      <div class="tabs">
        <button id="tabLogin" class="primary">Connexion</button>
        <button id="tabSignup">Créer</button>
      </div>

      <div id="paneLogin" style="margin-top:12px">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
        <input id="loginPass" type="password" placeholder="Mot de passe" autocomplete="current-password">
        <div class="row">
          <button class="primary" id="btnLogin">Se connecter</button>
          <button id="btnReset">Reset</button>
        </div>
        <div class="small" id="loginHint"></div>
      </div>

      <div id="paneSignup" style="margin-top:12px; display:none">
        <input id="signEmail" type="email" placeholder="Email" autocomplete="email">
        <input id="signPass" type="password" placeholder="Mot de passe (min 6)" autocomplete="new-password">
        <div class="row">
          <button class="primary" id="btnSignup">Créer</button>
          <button id="btnBackLogin">Retour</button>
        </div>
        <div class="small">Si la confirmation email est activée sur Supabase, tu devras valider l’email.</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
