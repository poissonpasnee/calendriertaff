<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendrier Travail 2026</title>

<style>
:root{
  --bg:#0e1117;
  --panel:#151a23;
  --border:#242b3a;
  --text:#e6e8ee;
  --muted:#9aa4b2;
  --primary:#1f6feb;

  --jour:#4f8cff;
  --nuit:#b983ff;
  --conges:#2ecc71;
  --repos:#7f8c8d;

  --radius:14px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg);
  color:var(--text);
}
button{
  background:none;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:12px;
  padding:10px 14px;
  font-weight:600;
  cursor:pointer;
}
button.primary{background:var(--primary);border-color:var(--primary)}
button.danger{border-color:#3a1f1f;color:#ff6b6b}
button:active{transform:scale(.97)}

.appbar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(14,17,23,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.appbar-inner{
  max-width:1100px;
  margin:auto;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
main{
  max-width:1100px;
  margin:auto;
  padding:16px 12px 140px;
}
.calendar{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px;
}
.weekdays,.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.weekdays div{
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
.day{
  height:48px;
  border-radius:12px;
  background:#0f1420;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  cursor:pointer;
}
.day.out{opacity:.35}
.day.selected{outline:2px solid var(--primary)}
.day.jour{background:rgba(79,140,255,.25)}
.day.nuit{background:rgba(185,131,255,.25)}
.day.conges{background:rgba(46,204,113,.25)}
.day.repos{background:rgba(127,140,141,.25)}

.dock{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(14,17,23,.95);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:10px;
}
.dock-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.dock-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
@media(min-width:900px){
  .dock{position:static;background:none;border:none}
  .dock-inner{flex-direction:row;justify-content:space-between;align-items:center}
  .dock-actions{grid-template-columns:auto auto auto auto}
}
.auth{
  position:fixed;
  inset:0;
  background:rgba(14,17,23,.95);
  display:flex;
  align-items:center;
  justify-content:center;
}
.auth-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  width:100%;
  max-width:360px;
}
input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0f1420;
  color:var(--text);
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="appbar">
  <div class="appbar-inner">
    <strong>Calendrier Travail 2026</strong>
    <button id="logoutBtn" class="danger">Déconnexion</button>
  </div>
</div>

<main>
  <div class="calendar">
    <div class="weekdays">
      <div>Dim</div><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<div class="dock">
  <div class="dock-inner">
    <div id="info">Sélectionne un jour</div>
    <div class="dock-actions">
      <button data-s="jour">Jour</button>
      <button data-s="nuit">Nuit</button>
      <button data-s="conges">Congés</button>
      <button data-s="repos">Repos</button>
    </div>
  </div>
</div>

<div class="auth" id="auth">
  <div class="auth-card">
    <h3>Connexion</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Mot de passe">
    <button class="primary" id="login">Se connecter</button>
    <button id="signup">Créer un compte</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://dstmyvzjirgyuwuojwnk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzdG15dnpqaXJneXV3dW9qd25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzY4NTUsImV4cCI6MjA4NTM1Mjg1NX0.Cl6WAvK0elHkKXnXRtrFFiBlGABnK5RTFdawq3NGDJk"
);

const YEAR=2026;
const grid=document.getElementById("grid");
const info=document.getElementById("info");
let user=null;
let selected=null;
const data=new Map();

async function load(){
  const {data:rows}=await supabase
    .from("work_calendar_entries")
    .select("work_date,status")
    .eq("user_id",user.id);
  rows.forEach(r=>data.set(r.work_date,r.status));
}

function render(){
  grid.innerHTML="";
  const first=new Date(YEAR,0,1);
  const start=new Date(first);
  start.setDate(1-first.getDay());
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const div=document.createElement("div");
    div.className="day";
    if(d.getFullYear()!==YEAR)div.classList.add("out");
    if(key===selected)div.classList.add("selected");
    if(data.has(key))div.classList.add(data.get(key));
    div.textContent=d.getDate();
    div.onclick=()=>{selected=key;info.textContent=key;render();}
    grid.appendChild(div);
  }
}

async function save(state){
  if(!selected)return;
  data.set(selected,state);
  await supabase.from("work_calendar_entries").upsert({
    user_id:user.id,work_date:selected,status:state
  });
  render();
}

document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>save(b.dataset.s));

document.getElementById("login").onclick=async()=>{
  const e=email.value,p=password.value;
  const {error}=await supabase.auth.signInWithPassword({email:e,password:p});
  if(!error)init();
};
document.getElementById("signup").onclick=async()=>{
  const e=email.value,p=password.value;
  await supabase.auth.signUp({email:e,password:p});
};

document.getElementById("logoutBtn").onclick=async()=>{
  await supabase.auth.signOut();location.reload();
};

async function init(){
  const {data:u}=await supabase.auth.getUser();
  if(!u.user)return;
  user=u.user;
  auth.style.display="none";
  await load();
  render();
}
init();
</script>
</body>
</html>
