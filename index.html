<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning SNCF</title>

<style>
:root{
  --bg:#0e1117;
  --panel:#151a23;
  --border:#242b3a;
  --text:#e6e8ee;
  --muted:#9aa4b2;
  --primary:#1f6feb;

  --jour:#facc15;
  --nuit:#8b5cf6;
  --repos:#6b7280;
  --conges:#7f1d1d;
  --autre:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg);
  color:var(--text);
}
button{
  background:none;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:12px;
  padding:8px 12px;
  font-weight:600;
  cursor:pointer;
}
button.primary{background:var(--primary);border-color:var(--primary)}
button.danger{border-color:#3a1f1f;color:#ff6b6b}
button:active{transform:scale(.97)}

.appbar{
  position:sticky;top:0;z-index:10;
  background:rgba(14,17,23,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.appbar-inner{
  max-width:1400px;
  margin:auto;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nav{
  display:flex;
  gap:6px;
  align-items:center;
}

main{
  max-width:1400px;
  margin:auto;
  padding:16px 12px 120px;
}

.calendar{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
}

.header,.grid{
  display:grid;
  grid-template-columns:50px repeat(7,1fr);
  gap:6px;
  text-align:center;
}
.header{font-size:12px;color:var(--muted)}
.week{padding-top:14px;font-size:12px;color:var(--muted)}

.day{
  height:48px;
  border-radius:12px;
  background:#0f1420;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  cursor:pointer;
}
.day.jour{background:rgba(250,204,21,.35)}
.day.nuit{background:rgba(139,92,246,.35)}
.day.repos{background:rgba(107,114,128,.35)}
.day.conges{background:rgba(127,29,29,.45)}
.day.autre{background:rgba(245,158,11,.35)}
.day.selected{outline:2px solid var(--primary)}

.sidebar{
  margin-top:12px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.dock{
  position:fixed;
  bottom:0;left:0;right:0;
  background:rgba(14,17,23,.95);
  border-top:1px solid var(--border);
  padding:10px;
}
.dock-actions{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}
</style>
</head>

<body>

<div class="appbar">
  <div class="appbar-inner">
    <strong>Planning SNCF</strong>
    <div class="nav">
      <button id="today">Aujourd’hui SNCF</button>
      <button id="prev">‹</button>
      <button id="next">›</button>
      <button id="export">Export Excel</button>
      <button id="logout" class="danger">Déconnexion</button>
    </div>
  </div>
</div>

<main>
  <div class="calendar">
    <div class="header">
      <div>Sem</div>
      <div>Di/Lu</div><div>Lu/Ma</div><div>Ma/Me</div>
      <div>Me/Je</div><div>Je/Ve</div><div>Ve/Sa</div><div>Sa/Di</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="sidebar">
    <button data-s="jour">Jour</button>
    <button data-s="nuit">Nuit</button>
    <button data-s="repos">Repos</button>
    <button data-s="conges">Congés</button>
    <button data-s="autre">Autre</button>
    <button data-s="note">📝 Note</button>
    <button data-s="lock">🔒 Verrouiller</button>
  </div>
</main>

<div class="dock">
  <div class="dock-actions">
    <button data-s="jour">Jour</button>
    <button data-s="nuit">Nuit</button>
    <button data-s="repos">Repos</button>
    <button data-s="conges">Congés</button>
    <button data-s="autre">Autre</button>
    <button data-s="note">📝</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase=createClient(
  "https://dstmyvzjirgyuwuojwnk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzdG15dnpqaXJneXV3dW9qd25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzY4NTUsImV4cCI6MjA4NTM1Mjg1NX0.Cl6WAvK0elHkKXnXRtrFFiBlGABnK5RTFdawq3NGDJk"
);

let user=null;
let selected=null;
let cursor=new Date();
const grid=document.getElementById("grid");
const data=new Map();

function isoWeek(d){
  d=new Date(d);d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-(d.getDay()+6)%7);
  const w1=new Date(d.getFullYear(),0,4);
  return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);
}

async function load(){
  const {data:rows}=await supabase
    .from("work_calendar_entries")
    .select("*")
    .eq("user_id",user.id);
  rows.forEach(r=>data.set(r.work_date,r));
}

async function save(status,label=null,note=null,locked=null){
  if(!selected)return;
  const row={
    user_id:user.id,
    work_date:selected,
    status,
    custom_label:label,
    note,
    locked
  };
  await supabase.from("work_calendar_entries").upsert(row);
  await load();render();
}

function render(){
  grid.innerHTML="";
  const start=new Date(cursor);
  start.setDate(start.getDate()-start.getDay());

  for(let w=0;w<1;w++){
    const wd=new Date(start);
    const wDiv=document.createElement("div");
    wDiv.className="week";
    wDiv.textContent=isoWeek(wd);
    grid.appendChild(wDiv);

    for(let i=0;i<7;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);
      const key=d.toISOString().slice(0,10);
      const div=document.createElement("div");
      div.className="day";
      if(data.has(key))div.classList.add(data.get(key).status);
      if(key===selected)div.classList.add("selected");
      div.textContent=d.getDate();
      div.onclick=()=>{selected=key;render();};
      grid.appendChild(div);
    }
  }
}

document.querySelectorAll("[data-s]").forEach(b=>{
  b.onclick=()=>{
    if(!selected)return alert("Sélectionne un jour SNCF");
    const t=b.dataset.s;
    if(t==="autre"){
      const l=prompt("OCP / Férié / texte libre","OCP");
      if(l)save("autre",l);
      return;
    }
    if(t==="note"){
      const n=prompt("Note de service","");
      if(n!==null)save(data.get(selected)?.status||"jour",null,n);
      return;
    }
    if(t==="lock"){
      save(data.get(selected)?.status||"jour",null,null,true);
      return;
    }
    save(t);
  };
});

document.getElementById("today").onclick=()=>{
  const now=new Date();
  if(now.getHours()>=22)now.setDate(now.getDate()+1);
  cursor=now;selected=now.toISOString().slice(0,10);render();
};
document.getElementById("prev").onclick=()=>{cursor.setDate(cursor.getDate()-7);render();}
document.getElementById("next").onclick=()=>{cursor.setDate(cursor.getDate()+7);render();}

document.getElementById("export").onclick=()=>{
  let csv="Date;Semaine;Type;Label;Note\n";
  data.forEach(r=>{
    csv+=`${r.work_date};${isoWeek(new Date(r.work_date))};${r.status};${r.custom_label||""};${r.note||""}\n`;
  });
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="planning_sncf.csv";
  a.click();
};

document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();location.reload();};

async function init(){
  const {data:u}=await supabase.auth.getUser();
  if(!u.user)return;
  user=u.user;
  await load();
  render();
}
init();
</script>
</body>
</html>
