<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendrier Travail 2023–2035</title>

<style>
:root{
  --bg:#0e1117;
  --panel:#151a23;
  --border:#242b3a;
  --text:#e6e8ee;
  --muted:#9aa4b2;
  --primary:#1f6feb;

  --jour:#facc15;
  --nuit:#8b5cf6;
  --conges:#7f1d1d;
  --repos:#6b7280;
  --autre:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg);
  color:var(--text);
}
button{
  background:none;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:12px;
  padding:8px 12px;
  font-weight:600;
  cursor:pointer;
}
button.danger{border-color:#3a1f1f;color:#ff6b6b}
button:active{transform:scale(.97)}

.appbar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(14,17,23,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.appbar-inner{
  max-width:1400px;
  margin:auto;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nav-calendar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.nav-group{display:flex;gap:4px}
.nav-current{text-align:center}
.nav-month{font-weight:700}
.nav-year{font-size:13px;color:var(--muted)}

main{
  max-width:1400px;
  margin:auto;
  padding:16px 12px 140px;
}
.layout{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

.calendar{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
}
.header-row,.grid{
  display:grid;
  grid-template-columns:50px repeat(7,1fr);
  gap:6px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
.week{padding-top:14px}
.day{
  height:46px;
  border-radius:12px;
  background:#0f1420;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  cursor:pointer;
}
.day.out{opacity:.35}
.day.selected{outline:2px solid var(--primary)}
.day.jour{background:rgba(250,204,21,.35)}
.day.nuit{background:rgba(139,92,246,.35)}
.day.conges{background:rgba(127,29,29,.45)}
.day.repos{background:rgba(107,114,128,.35)}
.day.autre{background:rgba(245,158,11,.35)}

.sidebar{display:none}
@media(min-width:900px){
  .layout{grid-template-columns:1fr 280px}
  .sidebar{
    display:block;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
  }
}

.dock{
  position:fixed;
  bottom:0;left:0;right:0;
  background:rgba(14,17,23,.95);
  border-top:1px solid var(--border);
  padding:10px;
}
.dock-actions{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
@media(min-width:900px){
  .dock{position:static;background:none;border:none}
}
</style>
</head>

<body>

<div class="appbar">
  <div class="appbar-inner">
    <strong>Calendrier Travail</strong>

    <div class="nav-calendar">
      <div class="nav-group">
        <button id="prevYear">«</button>
        <button id="prevMonth">‹</button>
      </div>

      <div class="nav-current">
        <div class="nav-month" id="navMonth"></div>
        <div class="nav-year" id="navYear"></div>
      </div>

      <div class="nav-group">
        <button id="nextMonth">›</button>
        <button id="nextYear">»</button>
      </div>

      <button id="exportExcel">Export Excel</button>
      <button id="logout" class="danger">Déconnexion</button>
    </div>
  </div>
</div>

<main>
  <div class="layout">
    <div class="calendar">
      <div class="header-row">
        <div>Sem</div>
        <div>Di/Lu</div><div>Lu/Ma</div><div>Ma/Me</div>
        <div>Me/Je</div><div>Je/Ve</div><div>Ve/Sa</div><div>Sa/Dim</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <aside class="sidebar">
      <h4 id="sideInfo">—</h4>
      <button data-s="jour">Jour</button>
      <button data-s="nuit">Nuit</button>
      <button data-s="conges">Congés</button>
      <button data-s="repos">Repos</button>
      <button data-s="autre">Autre</button>
    </aside>
  </div>
</main>

<div class="dock">
  <div id="info">Sélectionne un jour</div>
  <div class="dock-actions">
    <button data-s="jour">Jour</button>
    <button data-s="nuit">Nuit</button>
    <button data-s="conges">Congés</button>
    <button data-s="repos">Repos</button>
    <button data-s="autre">Autre</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://dstmyvzjirgyuwuojwnk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzdG15dnpqaXJneXV3dW9qd25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzY4NTUsImV4cCI6MjA4NTM1Mjg1NX0.Cl6WAvK0elHkKXnXRtrFFiBlGABnK5RTFdawq3NGDJk"
);

const MONTHS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
let year=2026,month=0,selected=null,user=null;
const grid=document.getElementById("grid");
const info=document.getElementById("info");
const sideInfo=document.getElementById("sideInfo");
const data=new Map();

function isoWeek(d){
  const date=new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000-3+(week1.getDay()+6)%7)/7);
}

async function load(){
  const {data:rows}=await supabase
    .from("work_calendar_entries")
    .select("work_date,status,custom_label")
    .eq("user_id",user.id);
  rows.forEach(r=>data.set(r.work_date,{status:r.status,label:r.custom_label}));
}

async function save(status,label=null){
  if(!selected)return;
  data.set(selected,{status,label});
  await supabase.from("work_calendar_entries").upsert({
    user_id:user.id,work_date:selected,status,custom_label:label
  });
  render();
}

function render(){
  grid.innerHTML="";
  document.getElementById("navMonth").textContent=MONTHS[month];
  document.getElementById("navYear").textContent=year;

  const first=new Date(year,month,1);
  const start=new Date(first);start.setDate(1-first.getDay());

  for(let w=0;w<6;w++){
    const d=new Date(start);d.setDate(start.getDate()+w*7);
    const wDiv=document.createElement("div");
    wDiv.className="week";wDiv.textContent=isoWeek(d);
    grid.appendChild(wDiv);

    for(let i=0;i<7;i++){
      const day=new Date(d);day.setDate(d.getDate()+i);
      const key=day.toISOString().slice(0,10);
      const div=document.createElement("div");
      div.className="day";
      if(day.getMonth()!==month)div.classList.add("out");
      if(data.has(key))div.classList.add(data.get(key).status);
      if(key===selected)div.classList.add("selected");
      div.textContent=day.getDate();
      div.onclick=()=>{selected=key;info.textContent=key;sideInfo.textContent=key;render();};
      grid.appendChild(div);
    }
  }
}

document.querySelectorAll("[data-s]").forEach(b=>{
  b.onclick=()=>{
    if(!selected)return alert("Sélectionne un jour");
    if(b.dataset.s==="autre"){
      const label=prompt("Autre (OCP, Férié, texte libre)", "OCP");
      if(label)save("autre",label.trim());
      return;
    }
    save(b.dataset.s);
  };
});

document.getElementById("prevMonth").onclick=()=>{month--;if(month<0){month=11;year--;}render();}
document.getElementById("nextMonth").onclick=()=>{month++;if(month>11){month=0;year++;}render();}
document.getElementById("prevYear").onclick=()=>{year--;render();}
document.getElementById("nextYear").onclick=()=>{year++;render();}
document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();location.reload();};

async function init(){
  const {data:u}=await supabase.auth.getUser();
  if(!u.user)return;
  user=u.user;
  await load();
  render();
}
init();
</script>
</body>
</html>
